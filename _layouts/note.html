---
layout: default
---
<article class="note"><div class="wrap">
  <div class="col">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.reading %} · {{ page.reading }}{% endif %}</p>
  </div>
  <div class="col">
    {{ content }}
  </div>
</div></article>
