<noscript><style>.cell{display:none}</style></noscript>
<div class="cell" data-cell aria-hidden="true">
  <canvas data-gripper-canvas></canvas>
  <div class="celltag">
    <span>sim · 2-link planar arm · parallel jaw</span>
    <span data-cell-state>idle</span>
  </div>
</div>
<script>
(function () {
  var cell = document.querySelector('[data-cell]');
  if (!cell) return;
  if (window.HTMLScriptElement && HTMLScriptElement.supports && !HTMLScriptElement.supports('importmap')) {
    cell.hidden = true;
    return;
  }
  var hero = cell.closest('.hero');
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) {
    cell.hidden = true;
    return;
  }
  if (hero) hero.classList.remove('hero--solo');
  var hint = document.querySelector('[data-hint]');
  if (hint) hint.hidden = false;
  function degrade() {
    cell.hidden = true;
    if (hero) hero.classList.add('hero--solo');
    if (hint) hint.hidden = true;
  }
  function load() {
    var s = document.createElement('script');
    s.type = 'module';
    s.src = '{{ "/assets/js/gripper.js" | relative_url }}';
    s.onerror = degrade;
    document.head.appendChild(s);
  }
  var idle = window.requestIdleCallback
    ? function (f) { requestIdleCallback(f, { timeout: 2000 }); }
    : function (f) { setTimeout(f, 0); };
  if (document.readyState === 'complete') idle(load);
  else addEventListener('load', function () { idle(load); });
})();
</script>
